[package]
name = "encryption_app"
version = "0.1.0"
edition = "2021"
default-run = "encryption_app"

[dependencies]
aes-gcm = "0.10.3"   
rand = "0.8.5"
eframe = "0.29.1"
egui = "0.29.1"
rfd = "0.15.1"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
image = "0.25.5" # Add image crate

[lib]
name = "encryption_app"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

# Browser build only. Native builds and the CLI are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Random salts and nonces: in a browser the OS random source is crypto.getRandomValues, which
# getrandom reaches only with its `js` feature.
getrandom = { version = "0.2", features = ["js"] }
# Runs the async file picker (rfd) in the browser; the standard library has no executor for it.
wasm-bindgen-futures = "0.4"
