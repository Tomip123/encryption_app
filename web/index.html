<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Encryption App - runs in your browser</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; }
  canvas { display: block; width: 100%; height: 100%; }
  /* Visible until the app starts; the app clears it, or replaces it with the reason it could not. */
  #status {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem;
    color: #cfcfcf; font: 16px/1.5 system-ui, sans-serif; text-align: center; pointer-events: none;
  }
  #status:empty { display: none; }
</style>
</head>
<body>
<canvas id="app_canvas"></canvas>
<p id="status">Loading. This runs entirely in your browser: your files never leave your device.</p>
<noscript><p style="color:#cfcfcf;font:16px system-ui;padding:1rem">This app needs JavaScript and WebAssembly.</p></noscript>
<script type="module" src="./start.js"></script>
</body>
</html>
